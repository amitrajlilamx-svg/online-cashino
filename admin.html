
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONLINE CASHINO - Admin Panel</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:16px;background:#101010;
 color:white;font-family:Arial,sans-serif;
}
.container{
 max-width:650px;margin:25px auto;padding:20px;
 background:#1d1d1d;border:1px solid #d4af37;
 border-radius:15px;
}
h1,h2{text-align:center;color:#ffd700}
input{
 width:100%;padding:13px;margin:10px 0;
 border:1px solid #d4af37;border-radius:7px;
 background:#101010;color:white;
}
button{
 width:100%;padding:13px;margin-top:10px;
 background:linear-gradient(45deg,#b8860b,#ffd700);
 border:0;border-radius:7px;font-weight:bold;
 cursor:pointer;
}
button:disabled{opacity:.6}
#dashboard{display:none}
#message{
 text-align:center;color:#ffd700;
 overflow-wrap:anywhere;
}
.stats{
 background:#292929;padding:18px;margin:12px 0;
 border:1px solid #d4af37;border-radius:10px;
 text-align:center;
}
.number{
 font-size:30px;color:#ffd700;font-weight:bold;
}
.user,.details{
 background:#292929;border:1px solid #555;
 padding:12px;margin:10px 0;border-radius:8px;
 overflow-wrap:anywhere;
}
.details{border-color:#d4af37}
.user small,.details small{
 display:block;color:#bbb;margin-top:7px;
}
.status{color:#70e090;font-weight:bold}
.secondary{background:#444;color:white}
.addPoints{background:#168c45;color:white}
.historyItem{
 background:#171717;border:1px solid #555;
 padding:10px;margin:8px 0;border-radius:7px;
 line-height:1.6;
}
#userList{margin-top:15px}
</style>
</head>

<body>
<div class="container">

<h1>🎰 ONLINE CASHINO</h1>
<h2>ADMIN PANEL</h2>

<div id="loginBox">
<h3>ADMIN LOGIN</h3>

<input type="email" id="adminEmail"
placeholder="Admin Email" autocomplete="username">

<input type="password" id="adminPassword"
placeholder="Admin Password" autocomplete="current-password">

<button id="loginBtn">ADMIN LOGIN</button>
</div>

<div id="dashboard">

<h2>ADMIN DASHBOARD</h2>
<p id="adminInfo"></p>

<div class="stats">
TOTAL REGISTERED USERS
<div class="number" id="totalUsers">0</div>
</div>

<div class="stats">
NEW USERS TODAY
<div class="number" id="todayUsers">0</div>
</div>

<div class="stats">
TOTAL GAMES PLAYED
<div class="number" id="totalGames">0</div>
</div>

<div class="stats">
TOTAL DEMO POINTS
<div class="number" id="totalPoints">0</div>
</div>

<h3>🔎 SEARCH USER</h3>
<input type="search" id="searchUser"
placeholder="Search user email...">

<h3>👥 REGISTERED USER LIST</h3>
<div id="userList">Loading users...</div>

<div id="userDetails"></div>

<button id="refreshBtn">REFRESH USERS</button>
<button id="logoutBtn" class="secondary">LOGOUT</button>

</div>

<p id="message">Secure Admin Access</p>
</div>

<script type="module">

import { auth, db } from "./firebase-config.js";

import {
 signInWithEmailAndPassword,
 signOut,
 onAuthStateChanged,
 getIdTokenResult
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
 ref,
 get,
 runTransaction,
 push
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";

const email = document.getElementById("adminEmail");
const password = document.getElementById("adminPassword");
const loginBox = document.getElementById("loginBox");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");
const userList = document.getElementById("userList");

const totalUsers = document.getElementById("totalUsers");
const todayUsers = document.getElementById("todayUsers");
const totalGames = document.getElementById("totalGames");
const totalPoints = document.getElementById("totalPoints");

const searchUser = document.getElementById("searchUser");
const userDetails = document.getElementById("userDetails");
const loginBtn = document.getElementById("loginBtn");

let adminVerified = false;
let allUsers = [];
let loginInProgress = false;

// ADMIN LOGIN
loginBtn.addEventListener("click", async function(){

 if(loginInProgress) return;

 if(!email.value.trim() || !password.value){
  message.textContent = "Enter Email and Password";
  return;
 }

 loginInProgress = true;
 loginBtn.disabled = true;
 message.textContent = "Checking Admin Access...";

 try{

  await signInWithEmailAndPassword(
   auth,
   email.value.trim(),
   password.value
  );

  message.textContent = "Login Successful. Verifying Admin...";

 }catch(error){

  message.textContent = "Login Error: " + error.message;

 }finally{

  loginInProgress = false;
  loginBtn.disabled = false;

 }

});

// CHECK ADMIN LOGIN
onAuthStateChanged(auth, async(user)=>{

 adminVerified = false;

 if(!user){
  loginBox.style.display = "block";
  dashboard.style.display = "none";
  message.textContent = "Please Admin Login";
  return;
 }

 message.textContent = "Verifying Admin Permission...";

 try{

  const token = await getIdTokenResult(user,true);

  if(token.claims.admin === true){

   adminVerified = true;

   loginBox.style.display = "none";
   dashboard.style.display = "block";

   document.getElementById("adminInfo").textContent =
    "Admin: " + user.email;

   message.textContent = "Admin Verified";

   await loadUsers();

  }else{

   await signOut(auth);

   loginBox.style.display = "block";
   dashboard.style.display = "none";

   message.textContent =
    "Access Denied: Admin permission not assigned.";

  }

 }catch(error){

  adminVerified = false;
  loginBox.style.display = "block";
  dashboard.style.display = "none";

  message.textContent =
   "Admin Verification Error: " + error.message;

 }

});

// LOAD USERS
async function loadUsers(){

 if(!adminVerified) return;

 userList.textContent = "Loading users...";

 totalUsers.textContent = "...";
 todayUsers.textContent = "...";
 totalGames.textContent = "...";
 totalPoints.textContent = "...";

 try{

  const snapshot = await get(ref(db,"users"));

  if(!adminVerified) return;

  allUsers = [];

  if(snapshot.exists()){

   const users = snapshot.val();

   allUsers = Object.entries(users).map(([uid,data])=>({

    uid:uid,
    email:data.email || "No Email",
    createdAt:Number(data.createdAt || 0),
    lastLoginAt:Number(data.lastLoginAt || 0),
    gamePlayed:Number(data.gamePlayed || 0),
    demoPoints:Number(data.demoPoints || 0),
    lastGameActivity:Number(data.lastGameActivity || 0)

   }));

  }

  totalUsers.textContent = allUsers.length;

  const start = new Date();
  start.setHours(0,0,0,0);

  const todayCount = allUsers.filter(user=>
   user.createdAt >= start.getTime()
  ).length;

  todayUsers.textContent = todayCount;

  totalGames.textContent = allUsers.reduce(
   (sum,user)=>sum+user.gamePlayed,0
  );

  totalPoints.textContent = allUsers.reduce(
   (sum,user)=>sum+user.demoPoints,0
  );

  renderUsers(searchUser.value);

 }catch(error){

  totalUsers.textContent = "—";
  todayUsers.textContent = "—";
  totalGames.textContent = "—";
  totalPoints.textContent = "—";

  userList.textContent =
   "Error loading users: " + error.message;

 }

}

// FORMAT DATE
function formatDate(timestamp){

 return timestamp
  ? new Date(timestamp).toLocaleString()
  : "Not recorded";

}

// SHOW USER LIST
function renderUsers(query=""){

 if(!adminVerified) return;

 userList.replaceChildren();

 const filtered = allUsers.filter(user=>
  user.email.toLowerCase().includes(
   query.trim().toLowerCase()
  )
 );

 if(filtered.length===0){
  userList.textContent="No matching users found.";
  return;
 }

 filtered.forEach((user,index)=>{

  const card=document.createElement("div");
  card.className="user";

  const heading=document.createElement("strong");
  heading.textContent=(index+1)+". "+user.email;

  const date=document.createElement("small");
  date.textContent="Created: "+formatDate(user.createdAt);

  const points=document.createElement("small");
  points.textContent="Demo Points: "+user.demoPoints;

  const games=document.createElement("small");
  games.textContent="Games Played: "+user.gamePlayed;

  const activity=document.createElement("small");
  activity.textContent="Last Game: "+formatDate(user.lastGameActivity);

  const view=document.createElement("button");
  view.textContent="VIEW DETAILS";
  view.onclick=()=>showDetails(user);

  card.append(heading,date,points,games,activity,view);
  userList.appendChild(card);

 });

}

// ADD DEMO POINTS
async function addDemoPoints(user){

 if(!adminVerified || !auth.currentUser) return;

 const amountText=prompt(
  "Enter Demo Points to add for "+user.email+
  "\nCurrent Balance: "+user.demoPoints
 );

 if(amountText===null) return;

 const amount=Number(amountText);

 if(!Number.isSafeInteger(amount)||amount<=0){
  alert("Please enter a valid positive whole number.");
  return;
 }

 if(!confirm(
  "Add "+amount+" Demo Points to "+user.email+"?"
  )){
  return;
 }

 message.textContent="Adding Demo Points...";

 try{

  const transactionKey=push(
   ref(db,"users/"+user.uid+"/transactions")
  ).key;

  const transaction=await runTransaction(
   ref(db,"users/"+user.uid),
   current=>{

    if(!current) return;

    const oldBalance=Number(current.demoPoints)||0;
    const newBalance=oldBalance+amount;

    if(!Number.isSafeInteger(newBalance)) return;

    current.demoPoints=newBalance;

    if(!current.transactions){
     current.transactions={};
    }

    current.transactions[transactionKey]={
     type:"ADMIN_CREDIT",
     pointsChange:amount,
     balanceAfter:newBalance,
     createdAt:Date.now(),
     adminEmail:auth.currentUser.email || "Admin"
    };

    return current;

   },
   {applyLocally:false}
  );

  if(!transaction.committed){
   throw new Error("Could not update user balance.");
  }

  message.textContent=
   amount+" Demo Points added successfully!";

  alert(
   "SUCCESS!\n"+
   amount+" Demo Points added to "+user.email
  );

  await loadUsers();

  const updatedUser=allUsers.find(u=>u.uid===user.uid);

  if(updatedUser){
   showDetails(updatedUser);
  }

 }catch(error){

  console.error(error);

  message.textContent=
   "Add Points Error: "+error.message;

  alert("ERROR: "+error.message);

 }

}

// SHOW POINTS HISTORY
async function showPointsHistory(uid){

 const historyBox=document.getElementById("pointsHistory");

 if(!historyBox || !adminVerified) return;

 historyBox.textContent="Loading Points History...";

 try{

  const snapshot=await get(
   ref(db,"users/"+uid+"/transactions")
  );

  if(!adminVerified) return;

  historyBox.replaceChildren();

  if(!snapshot.exists()){
   historyBox.textContent="No Points History Found.";
   return;
  }

  const entries=Object.entries(snapshot.val())
   .map(([id,item])=>({id,...item}))
   .sort((a,b)=>(Number(b.createdAt)||0)-(Number(a.createdAt)||0));

  entries.forEach(item=>{

   const div=document.createElement("div");
   div.className="historyItem";

   const type=document.createElement("strong");
   type.textContent=item.type || "TRANSACTION";

   const change=document.createElement("small");
   change.textContent=
    "Points Change: "+(Number(item.pointsChange)||0);

   const after=document.createElement("small");
   after.textContent=
    "Balance After: "+(Number(item.balanceAfter)||0);

   const date=document.createElement("small");
   date.textContent="Date: "+formatDate(Number(item.createdAt)||0);

   div.append(type,change,after,date);

   if(item.winningNumber!==undefined){
    const win=document.createElement("small");
    win.textContent="Winning Number: "+item.winningNumber;
    div.appendChild(win);
   }

   if(item.adminEmail){
    const admin=document.createElement("small");
    admin.textContent="Admin: "+item.adminEmail;
    div.appendChild(admin);
   }

   historyBox.appendChild(div);

  });

 }catch(error){

  historyBox.textContent=
   "History Error: "+error.message;

 }

}

// USER DETAILS
function showDetails(user){

 if(!adminVerified) return;

 userDetails.replaceChildren();

 const card=document.createElement("div");
 card.className="details";

 const title=document.createElement("h3");
 title.textContent="👤 USER DETAILS";

 const emailLine=document.createElement("small");
 emailLine.textContent="Email: "+user.email;

 const uidLine=document.createElement("small");
 uidLine.textContent="UID: "+user.uid;

 const dateLine=document.createElement("small");
 dateLine.textContent="Created: "+formatDate(user.createdAt);

 const loginLine=document.createElement("small");
 loginLine.textContent="Last Login: "+formatDate(user.lastLoginAt);

 const pointsLine=document.createElement("small");
 pointsLine.textContent="🎁 Demo Points: "+user.demoPoints;

 const gamesLine=document.createElement("small");
 gamesLine.textContent="🎮 Games Played: "+user.gamePlayed;

 const activityLine=document.createElement("small");
 activityLine.textContent=
  "Last Game Activity: "+formatDate(user.lastGameActivity);

 const status=document.createElement("p");
 status.className="status";
 status.textContent="Account Status: REGISTERED";

 const addButton=document.createElement("button");
 addButton.className="addPoints";
 addButton.textContent="🎁 ADD DEMO POINTS";
 addButton.onclick=()=>addDemoPoints(user);

 const historyButton=document.createElement("button");
 historyButton.textContent="📜 VIEW POINTS HISTORY";
 historyButton.onclick=()=>showPointsHistory(user.uid);

 const historyTitle=document.createElement("h3");
 historyTitle.textContent="📜 USER POINTS HISTORY";

 const historyBox=document.createElement("div");
 historyBox.id="pointsHistory";
 historyBox.textContent="Press VIEW POINTS HISTORY.";

 const copyEmail=document.createElement("button");
 copyEmail.textContent="COPY EMAIL";
 copyEmail.onclick=()=>copyText(user.email);

 const copyUID=document.createElement("button");
 copyUID.textContent="COPY UID";
 copyUID.onclick=()=>copyText(user.uid);

 const close=document.createElement("button");
 close.className="secondary";
 close.textContent="CLOSE DETAILS";
 close.onclick=()=>userDetails.replaceChildren();

 card.append(
  title,emailLine,uidLine,dateLine,loginLine,
  pointsLine,gamesLine,activityLine,status,
  addButton,historyButton,historyTitle,historyBox,
  copyEmail,copyUID,close
 );

 userDetails.appendChild(card);

}

// COPY TEXT
async function copyText(value){

 if(!adminVerified) return;

 try{

  await navigator.clipboard.writeText(value);
  message.textContent="Copied Successfully!";

 }catch(error){

  message.textContent="Copy failed. Please use HTTPS page.";

 }

}

// SEARCH
searchUser.addEventListener("input",()=>{
 renderUsers(searchUser.value);
 userDetails.replaceChildren();
});

// REFRESH
document.getElementById("refreshBtn").onclick=async()=>{
 await loadUsers();
 userDetails.replaceChildren();
};

// LOGOUT
document.getElementById("logoutBtn").onclick=async()=>{

 adminVerified=false;
 allUsers=[];
 userDetails.replaceChildren();

 await signOut(auth);

};

</script>
</body>
</html>
