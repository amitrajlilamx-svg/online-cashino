
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONLINE CASHINO - AVIATOR</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#10131b;color:white;font-family:Arial}
.container{max-width:550px;margin:auto;background:#1b202b;padding:14px;border-radius:15px}
.header{text-align:center;padding:14px;background:#101722;border-radius:10px}
.header h2{margin:0;color:#e84a55}
.header p{margin:7px 0 0;color:#aaa}
.balance{text-align:center;background:#293243;padding:13px;margin-top:12px;border-radius:9px}
.balance strong{display:block;color:#39e78a;font-size:26px;margin-top:5px}
.game{height:260px;position:relative;overflow:hidden;margin-top:12px;border-radius:12px;background:linear-gradient(160deg,#172d45,#101723 65%);border:2px solid #34475e}
.stars{position:absolute;inset:0;background-image:radial-gradient(white 1px,transparent 1px);background-size:35px 35px;opacity:.25}
.multiplier{position:absolute;top:32%;width:100%;text-align:center;font-size:43px;font-weight:bold}
.plane{position:absolute;left:12%;bottom:24%;font-size:48px;transition:transform .1s}
.status{position:absolute;bottom:12px;width:100%;text-align:center;color:#b9c6d5;font-size:13px}
.controls{margin-top:12px;padding:13px;background:#293243;border-radius:10px}
h3{text-align:center;margin:5px 0 13px}
.bets{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
button{cursor:pointer}
.bets button{padding:12px 2px;background:#45536a;color:white;border:0;border-radius:7px;font-weight:bold}
.bets button.active{background:#f1bb35;color:#111}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.action{padding:14px 5px;border:0;border-radius:8px;font-weight:bold;font-size:14px}
.play{background:#28bb71;color:white}
.cash{background:#f1b936;color:#111}
.auto{background:#7854bb;color:white}
.repeat{background:#397bb4;color:white}
.action:disabled{opacity:.4;cursor:not-allowed}
.info{display:flex;justify-content:space-between;padding:12px;background:#172330;margin-top:9px;border-radius:7px}
.info span:last-child{color:#3ce58b;font-weight:bold}
.history{margin-top:13px;padding:12px;background:#293243;border-radius:10px}
.history h3{text-align:left}
.history-list{display:flex;flex-wrap:wrap;gap:7px}
.history-item{padding:8px 11px;border-radius:6px;background:#263d35;color:#42e28b;font-weight:bold}
.history-item.low{background:#472c37;color:#ff7884}
.note{text-align:center;color:#8f9bab;font-size:11px;margin-top:14px}
</style>
</head>
<body>
<div class="container">

<div class="header">
<h2>✈ ONLINE CASHINO</h2>
<p>AVIATOR CRASH GAME</p>
</div>

<div class="balance">
MY DEMO POINTS
<strong id="balance">1499.95</strong>
</div>

<div class="game">
<div class="stars"></div>
<div class="multiplier" id="multiplier">1.00x</div>
<div class="plane" id="plane">✈️</div>
<div class="status" id="status">WAITING FOR NEXT ROUND</div>
</div>

<div class="info"><span>BET AMOUNT</span><span id="betDisplay">1.00</span></div>
<div class="info"><span>ROUND STATUS</span><span id="roundStatus">READY</span></div>
<div class="info"><span>POSSIBLE WIN</span><span id="possibleWin">0.00</span></div>

<div class="controls">
<h3>💰 SELECT BET</h3>
<div class="bets">
<button class="active" onclick="setBet(1,this)">1</button>
<button onclick="setBet(5,this)">5</button>
<button onclick="setBet(25,this)">25</button>
<button onclick="setBet(100,this)">100</button>
<button onclick="setBet(500,this)">500</button>
</div>

<div class="actions">
<button class="action play" id="playBtn" onclick="playGame()">▶ PLAY</button>
<button class="action cash" id="cashBtn" onclick="cashOut()" disabled>CASH OUT</button>
<button class="action auto" id="autoBtn" onclick="toggleAuto()">AUTO: OFF</button>
<button class="action repeat" onclick="repeatBet()">REPEAT BET</button>
</div>
</div>

<div class="history">
<h3>📜 GAME HISTORY</h3>
<div class="history-list" id="history">
<div class="history-item">Waiting...</div>
</div>
</div>

<div class="note">DEMO POINTS ONLY • NO REAL MONEY</div>
</div>

<script>
let balance=1499.95;
let bet=1;
let multiplier=1;
let playing=false;
let auto=false;
let timer=null;
let autoWait=null;
let crashPoint=2;
let history=[];
let lastBet=1;
let roundStart=0;

const $=id=>document.getElementById(id);

function update(){
 $("balance").textContent=balance.toFixed(2);
 $("betDisplay").textContent=bet.toFixed(2);
 $("multiplier").textContent=multiplier.toFixed(2)+"x";
 $("possibleWin").textContent=
 playing?(bet*multiplier).toFixed(2):"0.00";
}

function setBet(v,btn){
 if(playing)return;
 bet=v;
 document.querySelectorAll(".bets button")
 .forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
 update();
}

function repeatBet(){
 if(playing)return;
 bet=lastBet;
 document.querySelectorAll(".bets button").forEach(b=>{
  b.classList.toggle("active",Number(b.textContent)===bet);
 });
 update();
}

function playGame(){
 if(playing)return;
 clearTimeout(autoWait);

 if(balance<bet){
  $("status").textContent="NOT ENOUGH DEMO POINTS";
  auto=false;
  $("autoBtn").textContent="AUTO: OFF";
  return;
 }

 lastBet=bet;
 balance-=bet;
 multiplier=1;
 playing=true;
 crashPoint=1.10+Math.random()*8.9;
 roundStart=Date.now();

 $("status").textContent="✈️ PLANE TAKING OFF";
 $("roundStatus").textContent="RUNNING";
 $("playBtn").disabled=true;
 $("cashBtn").disabled=false;
 $("plane").style.transform="translate(0,0)";
 update();

 timer=setInterval(()=>{
  let elapsed=(Date.now()-roundStart)/1000;
  multiplier=Math.exp(elapsed*.20);

  $("plane").style.transform=
  "translate("+Math.min(elapsed*18,210)+"px,-"+
  Math.min(elapsed*13,130)+"px) rotate(-12deg)";

  update();

  if(multiplier>=crashPoint){
   multiplier=crashPoint;
   update();
   crash();
  }
 },50);
}

function cashOut(){
 if(!playing)return;

 clearInterval(timer);
 let win=bet*multiplier;
 balance+=win;
 playing=false;

 $("status").textContent="💰 CASH OUT "+multiplier.toFixed(2)+"x";
 $("roundStatus").textContent="CASHED OUT";
 $("playBtn").disabled=false;
 $("cashBtn").disabled=true;

 addHistory(multiplier);
 update();
 scheduleAuto();
}

function crash(){
 if(!playing)return;

 clearInterval(timer);
 playing=false;

 $("status").textContent="💥 CRASHED AT "+multiplier.toFixed(2)+"x";
 $("roundStatus").textContent="CRASHED";
 $("playBtn").disabled=false;
 $("cashBtn").disabled=true;

 addHistory(multiplier);
 update();
 scheduleAuto();
}

function addHistory(v){
 history.unshift(v);
 history=history.slice(0,15);
 $("history").innerHTML="";

 history.forEach(x=>{
  let item=document.createElement("div");
  item.className="history-item"+(x<2?" low":"");
  item.textContent=x.toFixed(2)+"x";
  $("history").appendChild(item);
 });
}

function toggleAuto(){
 auto=!auto;
 $("autoBtn").textContent=auto?"AUTO: ON":"AUTO: OFF";

 if(auto&&!playing){
  playGame();
 }

 if(!auto){
  clearTimeout(autoWait);
 }
}

function scheduleAuto(){
 if(!auto)return;
 autoWait=setTimeout(()=>{
  if(auto&&!playing)playGame();
 },1500);
}

update();
</script>
</body>
</html>
