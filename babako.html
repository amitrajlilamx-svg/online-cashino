
<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONLINE CASHINO - बाबाको खजाना</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:15px;
 background:#101010;color:white;
 font-family:Arial,sans-serif;
}
.container{
 max-width:520px;margin:20px auto;
 padding:18px;background:#1c1c1c;
 border:1px solid #333;border-radius:15px;
}
h2{text-align:center;color:#ffc107;margin-top:5px}
.balance{
 background:#101010;border:1px solid #ffc107;
 border-radius:12px;padding:15px;
 text-align:center;margin:15px 0;
}
.balance strong{display:block;color:#00e676;font-size:25px;margin-top:8px}
.betbox{
 display:flex;align-items:center;
 justify-content:center;gap:18px;margin:20px 0;
}
.betbox button{
 width:45px;height:42px;font-size:23px;
 border:0;border-radius:8px;background:#ffc107;
}
.betvalue{font-size:21px;font-weight:bold}
.boxes{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:10px;margin:20px 0;
}
.treasure{
 min-height:105px;border:2px solid #ffc107;
 border-radius:12px;background:#292929;
 color:white;font-size:38px;cursor:pointer;
}
.treasure:disabled{opacity:.55;cursor:not-allowed}
.treasure.selected{background:#594400}
button:disabled{opacity:.5}
.message{
 min-height:48px;text-align:center;
 padding:12px;margin:12px 0;
 background:#101010;border-radius:8px;
 color:#ffc107;line-height:1.5;
}
.mainbtn{
 width:100%;padding:13px;margin-top:10px;
 border:0;border-radius:9px;
 background:#ffc107;color:#111;
 font-size:16px;font-weight:bold;
}
.back{
 display:block;text-align:center;
 margin-top:20px;padding:12px;
 color:#ffc107;text-decoration:none;
 border:1px solid #ffc107;border-radius:9px;
}
.history{
 margin-top:22px;border-top:1px solid #444;
 padding-top:12px;
}
.history h3{color:#ffc107}
.history-item{
 padding:10px;margin:7px 0;
 background:#101010;border-radius:7px;
 font-size:13px;line-height:1.6;
}
.small{
 font-size:12px;color:#aaa;
 text-align:center;line-height:1.5;
}
</style>
</head>

<body>

<div class="container">

<h2>🎁 बाबाको खजाना</h2>

<div class="balance">
 MYR WALLET BALANCE
 <strong id="balance">Loading...</strong>
</div>

<div class="betbox">
 <button id="minusBtn" onclick="changeBet(-10)">−</button>
 <div class="betvalue" id="betValue">RM 10</div>
 <button id="plusBtn" onclick="changeBet(10)">+</button>
</div>

<h3 style="text-align:center">🎁 SELECT ONE TREASURE BOX</h3>

<div class="boxes">
 <button class="treasure" onclick="selectBox(0)">🎁</button>
 <button class="treasure" onclick="selectBox(1)">🎁</button>
 <button class="treasure" onclick="selectBox(2)">🎁</button>
</div>

<div class="message" id="message">
 आफ्नो खजाना बक्स छान्नुहोस्।
</div>

<button class="mainbtn" id="playBtn" onclick="startGame()">
 PLAY NOW
</button>

<div class="history">
 <h3>📜 GAME HISTORY</h3>
 <div id="historyList">Loading history...</div>
</div>

<a class="back" href="index.html">⌂ BACK HOME</a>

<p class="small">
Demo entertainment balance only. No real-money deposits,
withdrawals or cash prizes.
</p>

</div>

<script type="module">

import {auth,db} from "./firebase-config.js";

import {
 ref,get,set,update,push,onValue,
 runTransaction,serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";

let currentUser=null;
let walletRef=null;
let historyRef=null;
let bet=10;
let selectedBox=-1;
let busy=false;
let balance=0;

const balanceEl=document.getElementById("balance");
const messageEl=document.getElementById("message");
const playBtn=document.getElementById("playBtn");
const historyList=document.getElementById("historyList");
const treasureButtons=document.querySelectorAll(".treasure");

function showMessage(message){
 messageEl.textContent=message;
}

function setBusy(value){
 busy=value;
 playBtn.disabled=value;
 document.getElementById("plusBtn").disabled=value;
 document.getElementById("minusBtn").disabled=value;
 treasureButtons.forEach(button=>button.disabled=value);
}

function updateBetDisplay(){
 document.getElementById("betValue").textContent="RM "+bet;
}

window.changeBet=function(amount){
 if(busy)return;

 bet+=amount;

 if(bet<10)bet=10;
 if(bet>10000)bet=10000;

 updateBetDisplay();
};

window.selectBox=function(index){
 if(busy)return;

 selectedBox=index;

 treasureButtons.forEach((button,i)=>{
  button.classList.toggle("selected",i===index);
 });

 showMessage("तपाईंले बक्स "+(index+1)+" छान्नुभयो। PLAY NOW थिच्नुहोस्।");
};

/*
 WALLET MIGRATION:
 पुरानो demoPoints रकमलाई myr मा सार्छ।
 पुरानो demoPoints हटाउँदैन।
 */

async function migrateWalletToMYR(uid){

 const userRef=ref(db,"users/"+uid);
 const myrRef=ref(db,"users/"+uid+"/myr");

 const snapshot=await get(userRef);

 if(!snapshot.exists()){
  throw new Error("Firebase user record भेटिएन।");
 }

 const userData=snapshot.val()||{};

 let oldBalance=userData.demoPoints;

 if(typeof userData.myr==="number"){
  if(!Number.isFinite(userData.myr)||userData.myr<0){
   throw new Error("MYR balance सही नम्बर होइन।");
  }

  await update(userRef,{currency:"MYR"});
  return userData.myr;
 }

 if(typeof oldBalance!=="number"||
    !Number.isFinite(oldBalance)||
    oldBalance<0){

  throw new Error("पुरानो demoPoints balance भेटिएन वा गलत छ।");
 }

 const result=await runTransaction(
  myrRef,
  currentValue=>{
   if(typeof currentValue==="number"){
    return currentValue;
   }

   return oldBalance;
  },
  {applyLocally:false}
 );

 if(!result.committed){
  throw new Error("MYR wallet migration पूरा भएन।");
 }

 await update(userRef,{currency:"MYR"});

 return result.snapshot.val();
}

/*
 BALANCE LOAD
 */

async function loadBalance(){

 if(!currentUser)return;

 balanceEl.textContent="Loading...";

 try{

  await migrateWalletToMYR(currentUser.uid);

  walletRef=ref(db,"users/"+currentUser.uid+"/myr");

  onValue(walletRef,snapshot=>{

   const value=snapshot.val();

   if(typeof value==="number"&&Number.isFinite(value)){
    balance=value;
    balanceEl.textContent="RM "+value.toFixed(2);
   }else{
    balance=0;
    balanceEl.textContent="Invalid balance";
   }

  },error=>{
   showMessage("Wallet read error: "+error.message);
  });

  historyRef=ref(db,"users/"+currentUser.uid+"/babaTreasureHistory");

  loadHistory();

 }catch(error){

  balanceEl.textContent="Error";
  showMessage("Wallet error: "+error.message);
  console.error(error);

 }
}

/*
 ATOMIC WALLET CHANGE

 Win: +bet (2x total payout minus original stake)
 Loss: -bet
 */

async function changeBalance(amount){

 if(!currentUser){
  throw new Error("कृपया पहिले Login गर्नुहोस्।");
 }

 if(!walletRef){
  throw new Error("MYR wallet तयार भएको छैन।");
 }

 const result=await runTransaction(
  walletRef,
  currentValue=>{

   if(typeof currentValue!=="number"||
      !Number.isFinite(currentValue)||
      currentValue<0){
    return;
   }

   if(amount<0&&currentValue<Math.abs(amount)){
    return;
   }

   const nextValue=currentValue+amount;

   if(!Number.isFinite(nextValue)||nextValue<0){
    return;
   }

   return Number(nextValue.toFixed(2));

  },
  {applyLocally:false}
 );

 if(!result.committed){

  const current=result.snapshot.val();

  if(typeof current!=="number"){
   throw new Error("MYR balance उपलब्ध छैन। Firebase मा myr नम्बर जाँच गर्नुहोस्।");
  }

  if(amount<0&&current<Math.abs(amount)){
   throw new Error("पर्याप्त MYR balance छैन।");
  }

  throw new Error("Firebase transaction abort भयो। MYR Rules र wallet path जाँच गर्नुहोस्।");
 }

 return result.snapshot.val();
}

/*
 SAVE GAME HISTORY AND TRANSACTION
 */

async function saveGameRecord(won,amount,boxNumber,newBalance){

 const now=Date.now();

 const gameRecord={
  bet:bet,
  result:won?"WIN":"LOSE",
  profit:amount,
  selectedBox:boxNumber+1,
  balance:newBalance,
  currency:"MYR",
  createdAt:now
 };

 const transactionRecord={
  type:won?"BABA_TREASURE_WIN":"BABA_TREASURE_LOSS",
  amount:amount,
  balance:newBalance,
  currency:"MYR",
  createdAt:now
 };

 const gameRef=push(
  ref(db,"users/"+currentUser.uid+"/babaTreasureHistory")
 );

 const transactionRecordRef=push(
  ref(db,"users/"+currentUser.uid+"/transactions")
 );

 await Promise.all([
  set(gameRef,gameRecord),
  set(transactionRecordRef,transactionRecord)
 ]);
}

/*
 START GAME
 */

window.startGame=async function(){

 if(busy)return;

 if(!currentUser){
  showMessage("कृपया Login गर्नुहोस्।");
  return;
 }

 if(selectedBox===-1){
  showMessage("पहिले एउटा Treasure Box छान्नुहोस्।");
  return;
 }

 if(bet<=0){
  showMessage("Bet रकम सही छैन।");
  return;
 }

 setBusy(true);
 showMessage("खेल सुरु हुँदैछ...");

 try{

  /*
   3 boxes मध्ये एउटा random winning box
   */

  const winningBox=Math.floor(Math.random()*3);
  const won=(selectedBox===winningBox);

  /*
   Win मा +bet, loss मा -bet
   */

  const walletChange=won?bet:-bet;

  const newBalance=await changeBalance(walletChange);

  /*
   Result history save
   */

  try{

   await saveGameRecord(
    won,
    walletChange,
    selectedBox,
    newBalance
   );

  }catch(historyError){

   console.error("History save error:",historyError);

   showMessage(
    "खेलको रकम अपडेट भयो, तर History save हुन सकेन: "+
    historyError.message
   );

   selectedBox=-1;
   treasureButtons.forEach(button=>button.classList.remove("selected"));
   return;
  }

  if(won){

   showMessage(
    "🎉 बधाई छ! तपाईंले जित्नुभयो! Prize: RM "+
    (bet*2).toFixed(2)
   );

  }else{

   showMessage(
    "😔 तपाईं हार्नुभयो। Winning Box: "+
    (winningBox+1)
   );

  }

  selectedBox=-1;
  treasureButtons.forEach(button=>button.classList.remove("selected"));

 }catch(error){

  console.error("Game error:",error);

  showMessage("Bet सुरु हुन सकेन: "+error.message);

 }finally{

  setBusy(false);

 }

};

/*
 LOAD GAME HISTORY
 */

function loadHistory(){

 if(!currentUser)return;

 const historyPath=ref(
  db,"users/"+currentUser.uid+"/babaTreasureHistory"
 );

 onValue(historyPath,snapshot=>{

  if(!snapshot.exists()){
   historyList.innerHTML="<p>No game history yet.</p>";
   return;
  }

  const records=[];

  snapshot.forEach(child=>{
   records.push(child.val());
  });

  records.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

  historyList.innerHTML="";

  records.slice(0,20).forEach(item=>{

   const div=document.createElement("div");
   div.className="history-item";

   const date=item.createdAt?
    new Date(item.createdAt).toLocaleString():"";

   div.textContent=
    (item.result==="WIN"?"🎉 WIN":"😔 LOSE")+
    " | Bet: RM "+Number(item.bet||0).toFixed(2)+
    " | Change: RM "+Number(item.profit||0).toFixed(2)+
    " | Box: "+(item.selectedBox||"-")+
    " | "+date;

   historyList.appendChild(div);

  });

 },error=>{
  historyList.textContent="History error: "+error.message;
 });

}

/*
 AUTHENTICATION
 */

auth.onAuthStateChanged(async user=>{

 currentUser=user;

 if(!user){

  balanceEl.textContent="Login required";
  showMessage("खेल्नका लागि पहिले Login गर्नुहोस्।");
  playBtn.disabled=true;
  return;

 }

 playBtn.disabled=false;

 await loadBalance();

});

updateBetDisplay();

</script>

</body>
</html>
