
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONLINE CASHINO - User Profile</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:16px;
  background:#101010;
  color:white;
  font-family:Arial,sans-serif;
}

.container{
  max-width:550px;
  margin:25px auto;
  padding:20px;
  background:#1c1c1c;
  border-radius:15px;
}

h1{text-align:center;color:#ffc107}
h2{text-align:center}

.avatar{
  width:90px;
  height:90px;
  margin:20px auto;
  border-radius:50%;
  background:#333;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
  border:3px solid #ffc107;
}

.email{
  text-align:center;
  color:#00e676;
  overflow-wrap:anywhere;
  margin-bottom:25px;
}

.info{
  background:#292929;
  padding:14px;
  margin:10px 0;
  border-radius:8px;
  overflow-wrap:anywhere;
}

.info span{
  display:block;
  color:#aaa;
  font-size:12px;
  margin-bottom:6px;
}

.info strong{font-size:15px}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:0;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.refresh{background:#ffc107;color:black}
.back{background:#2196f3;color:white}
.wallet{background:#00a86b;color:white}
.logout{background:#e53935;color:white}

.notice{
  text-align:center;
  color:#aaa;
  font-size:12px;
  margin-top:20px;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="container">

<h1>🎰 ONLINE CASHINO</h1>
<h2>👤 USER PROFILE</h2>

<div class="avatar">👤</div>

<div class="email" id="email">Loading...</div>

<div class="info">
<span>USER UID</span>
<strong id="uid">Loading...</strong>
</div>

<div class="info">
<span>ACCOUNT CREATED</span>
<strong id="created">Loading...</strong>
</div>

<div class="info">
<span>💰 MYR WALLET BALANCE</span>
<strong id="points">Loading...</strong>
</div>

<div class="info">
<span>🎮 TOTAL GAMES PLAYED</span>
<strong id="games">Loading...</strong>
</div>

<div class="info">
<span>🕒 LAST LOGIN</span>
<strong id="login">Loading...</strong>
</div>

<div class="info">
<span>🏆 LAST GAME ACTIVITY</span>
<strong id="activity">Loading...</strong>
</div>

<button class="refresh" id="refreshBtn">
🔄 REFRESH PROFILE
</button>

<button class="wallet" id="walletBtn">
💰 MY WALLET
</button>

<button class="back" id="backBtn">
🎮 BACK TO GAME
</button>

<button class="logout" id="logoutBtn">
LOGOUT
</button>

<div class="notice">
ONLINE CASHINO - FREE ENTERTAINMENT DEMO
<br>
MYR display balance has no real cash value.
</div>

</div>

<script type="module">

import { auth, db } from "./firebase-config.js";

import {
  ref,
  get
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";

import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

const $ = id => document.getElementById(id);

let currentUID = null;

function formatDate(value){

  if(!value) return "Not available";

  const date = new Date(Number(value));

  return isNaN(date.getTime())
    ? "Not available"
    : date.toLocaleString();

}

async function loadProfile(){

  if(!currentUID) return;

  $("email").textContent = "Loading...";
  $("points").textContent = "Loading...";
  $("games").textContent = "Loading...";

  try{

    const snapshot = await get(
      ref(db, "users/" + currentUID)
    );

    const data = snapshot.exists()
      ? snapshot.val()
      : {};

    const user = auth.currentUser;

    $("email").textContent =
      data.email || user?.email || "Not available";

    $("uid").textContent = currentUID;

    const createdAt = data.createdAt ||
      (user?.metadata?.creationTime
        ? Date.parse(user.metadata.creationTime)
        : null);

    $("created").textContent =
      formatDate(createdAt);

    // MYR wallet balance
    const myrBalance = data.myr;

    $("points").textContent =
      typeof myrBalance === "number" &&
      Number.isFinite(myrBalance)
        ? "RM " + myrBalance.toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          })
        : "MYR wallet not initialized";

    $("games").textContent =
      Number(data.gamePlayed ?? 0).toLocaleString("en-US");

    $("login").textContent =
      formatDate(data.lastLoginAt);

    $("activity").textContent =
      formatDate(data.lastGameActivity);

  }catch(error){

    console.error("Profile Error:", error);

    $("email").textContent = "Error loading profile";
    $("points").textContent = "Unavailable";
    $("games").textContent = "Unavailable";

    alert("Profile Error: " + error.message);

  }

}

onAuthStateChanged(auth, async user => {

  if(!user){
    window.location.replace("index.html");
    return;
  }

  currentUID = user.uid;

  await loadProfile();

});

$("refreshBtn").addEventListener("click", loadProfile);

$("walletBtn").addEventListener("click", () => {
  window.location.href = "wallet.html";
});

$("backBtn").addEventListener("click", () => {
  window.location.href = "index.html";
});

$("logoutBtn").addEventListener("click", async () => {

  if(!confirm("Are you sure you want to logout?")) return;

  try{

    await signOut(auth);
    window.location.replace("index.html");

  }catch(error){

    alert("Logout Error: " + error.message);

  }

});

</script>

</body>
</html>
