
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONLINE CASHINO USER</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 padding:15px;
 background:#101010;
 color:white;
 font-family:Arial;
}
.container{
 max-width:550px;
 margin:25px auto;
 padding:20px;
 background:#202020;
 border:1px solid gold;
 border-radius:15px;
}
h1,h2{text-align:center;color:gold}
.card{
 background:#303030;
 padding:15px;
 margin:12px 0;
 border-radius:10px;
 overflow-wrap:anywhere;
}
small{display:block;margin-top:10px;color:#ddd}
.number{font-size:28px;color:gold;font-weight:bold}
button{
 width:100%;
 padding:14px;
 margin-top:12px;
 border:0;
 border-radius:8px;
 background:gold;
 font-weight:bold;
}
.secondary{background:#444;color:white}
#dashboard{display:none}
#message{color:gold;text-align:center}
</style>
</head>

<body>

<div class="container">

<h1>🎰 ONLINE CASHINO</h1>
<h2>USER DASHBOARD</h2>

<p id="message">Connecting Firebase...</p>

<div id="dashboard">

<div class="card">
<h3>👤 USER PROFILE</h3>
<small id="email"></small>
<small id="uid"></small>
<small id="created"></small>
</div>

<div class="card">
🎁 DEMO POINTS
<div class="number" id="points">0</div>
</div>

<div class="card">
🎮 GAMES PLAYED
<div class="number" id="games">0</div>
</div>

<div class="card">
LAST LOGIN
<small id="login"></small>
</div>

<div class="card">
LAST GAME ACTIVITY
<small id="activity"></small>
</div>

<button id="play">PLAY BABAKO KHAJANA</button>
<button id="refresh" class="secondary">REFRESH PROFILE</button>
<button id="logout" class="secondary">LOGOUT</button>

</div>
</div>

<script type="module">

try{

const {auth,db} = await import("./firebase-config.js");

const {
 onAuthStateChanged,
 signOut
} = await import(
 "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js"
);

const {
 ref,get
} = await import(
 "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js"
);

const message = document.getElementById("message");
const dashboard = document.getElementById("dashboard");

let currentUser = null;

function dateFormat(value){
 return value ? new Date(value).toLocaleString() : "Not recorded";
}

async function loadProfile(user){

 message.textContent = "Loading Profile...";

 try{

  const snapshot = await get(ref(db,"users/"+user.uid));

  if(!snapshot.exists()){
   message.textContent = "User data not found.";
   return;
  }

  const data = snapshot.val();

  document.getElementById("email").textContent =
   "Email: "+user.email;

  document.getElementById("uid").textContent =
   "UID: "+user.uid;

  document.getElementById("created").textContent =
   "Created: "+dateFormat(data.createdAt);

  document.getElementById("points").textContent =
   Number(data.demoPoints || 0);

  document.getElementById("games").textContent =
   Number(data.gamePlayed || 0);

  document.getElementById("login").textContent =
   dateFormat(data.lastLoginAt);

  document.getElementById("activity").textContent =
   dateFormat(data.lastGameActivity);

  message.textContent = "Welcome to ONLINE CASHINO!";

 }catch(error){

  message.textContent = "DATABASE ERROR: "+error.message;
  console.error(error);

 }

}

onAuthStateChanged(auth,async(user)=>{

 if(user){

  currentUser = user;
  dashboard.style.display = "block";

  await loadProfile(user);

 }else{

  currentUser = null;
  dashboard.style.display = "none";

  message.textContent = "Please login from index.html first.";

 }

});

document.getElementById("refresh").onclick = ()=>{
 if(currentUser) loadProfile(currentUser);
};

document.getElementById("play").onclick = ()=>{
 window.location.href = "index.html";
};

document.getElementById("logout").onclick = async()=>{
 await signOut(auth);
 window.location.href = "index.html";
};

}catch(error){

 document.getElementById("message").textContent =
 "ERROR: "+error.message;

 console.error(error);

}

</script>

</body>
</html>
